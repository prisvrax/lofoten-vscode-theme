<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <style>
      .editor        { fill: #344852; }
      .gutter        { fill: #3A505B; }
      .gutter-border { stroke: #445D6A; stroke-width: 1; }
      .line-current  { fill: #3C5360; }
      .selection    { fill: #4A6570; }
      .keyword      { fill: #D58D91; }
      .name         { fill: #C8D5DA; }
      .type         { fill: #B5A6C8; }
      .string       { fill: #C99BB4; }
      .number       { fill: #E4B2B4; }
      .punct        { fill: #83B6BC; }
      .comment      { fill: #7A9595; }
      .define       { fill: #E6BE9F; }
      .function     { fill: #5BBDC9; }
      .constant     { fill: #D6A078; }
      .bar          { rx: 5; }
    </style>
  </defs>

  <rect class="editor" x="0" y="0" width="1000" height="400"/>
  <rect class="gutter" x="0" y="0" width="68" height="400"/>
  <line class="gutter-border" x1="68" y1="0" x2="68" y2="400"/>

  <rect class="line-current" x="68" y="54" width="932" height="34"/>
  <rect class="selection" x="92" y="190" width="528" height="136" rx="4"/>

  <rect class="bar keyword"  x="92"  y="32" width="72" height="10"/>
