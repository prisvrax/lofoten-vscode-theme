  <rect class="bar string"  x="354" y="66" width="178" height="10"/>
  <rect class="bar punct"   x="540" y="66" width="12" height="10"/>

  <rect class="bar keyword" x="132" y="100" width="66" height="10"/>
  <rect class="bar function" x="208" y="100" width="146" height="10"/>
