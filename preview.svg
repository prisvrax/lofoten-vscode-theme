  <rect class="bar keyword" x="172" y="202" width="52" height="10"/>
  <rect class="bar name"    x="234" y="202" width="128" height="10"/>
  <rect class="bar punct"   x="372" y="202" width="12" height="10"/>
  <rect class="bar string"  x="396" y="202" width="152" height="10"/>

  <rect class="bar keyword"  x="172" y="236" width="66" height="10"/>
